name: Load newsletter sequence into Kit

# Runs when the kit-sequence branch is pushed (or by hand from the Actions tab).
# Creates or updates the evergreen Kit sequence from content/schedule.yaml.
# Emails stay as drafts unless sequence.publish is true.
on:
  workflow_dispatch:
  push:
    branches: [kit-sequence]

jobs:
  sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml jinja2
      - env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/kit_sequence.py
